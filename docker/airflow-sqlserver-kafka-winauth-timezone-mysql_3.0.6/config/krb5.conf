# =============================================================================
# Kerberos Configuration for Windows Authentication
# =============================================================================
# Edit this file with your domain settings before building the Docker image.
#
# Replace:
#   - YOUR_DOMAIN.COM → Your Active Directory domain (UPPERCASE)
#   - your-domain-controller.your_domain.com → Your Domain Controller hostname
#   - your_domain.com → Your domain in lowercase
# =============================================================================

[libdefaults]
    default_realm = YOUR_DOMAIN.COM
    dns_lookup_realm = false
    dns_lookup_kdc = true
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    rdns = false
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    YOUR_DOMAIN.COM = {
        kdc = your-domain-controller.your_domain.com
        admin_server = your-domain-controller.your_domain.com
        default_domain = your_domain.com
    }

[domain_realm]
    .your_domain.com = YOUR_DOMAIN.COM
    your_domain.com = YOUR_DOMAIN.COM

[logging]
    default = FILE:/var/log/krb5libs.log
    kdc = FILE:/var/log/krb5kdc.log
    admin_server = FILE:/var/log/kadmind.log
