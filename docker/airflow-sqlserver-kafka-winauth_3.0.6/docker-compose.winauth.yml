  #       if [ $Q -gt 50 ]; then TARGET=6;
  #       elif [ $Q -gt 20 ]; then TARGET=4;
  #       elif [ $Q -lt 5 ]; then TARGET=2;
  #       fi

  #       echo \"[autoscaler] queue=$Q current=$CUR target=$TARGET\";
  #       if [ \"$CUR\" != \"$TARGET\" ]; then
  #         docker compose up -d --scale airflow-worker=$TARGET;
  #       fi
  #       sleep 60;
  #     done
  #     "

  # Backup روزانه PostgreSQL + نگه‌داری ۷ روز
  postgres-backup:
    image: docker.arvancloud.ir/prodrigestivill/postgres-backup-local:latest
    restart: always
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_PORT: 5432
      SCHEDULE: "0 2 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - ./postgres-backups:/backups
    networks:
      - airflow_net

networks:
  airflow_net:
